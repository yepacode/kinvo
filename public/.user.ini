; Hostinger honra este archivo por PHP-FPM (per-directory user_ini).
; Sube los límites de subida para que /admin/content-items pueda
; recibir archivos de hasta 128 MB (petición Karla 27-ago).
upload_max_filesize = 128M
post_max_size = 130M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
